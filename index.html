<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" type="image/svg+xml" href="/app-logo.svg" />
    <link rel="apple-touch-icon" href="/app-logo.svg" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Body-Line | MemberHub</title>
    
    <script>
      // Display errors directly on screen for debugging
      window.onerror = function(msg, src, lineno, colno, err) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:red;color:white;z-index:999999;padding:20px;overflow:auto;word-wrap:break-word;';
        d.innerHTML = '<h2>CRITICAL ERROR</h2><p>' + msg + '</p><p>' + src + ':' + lineno + ':' + colno + '</p><pre>' + (err ? err.stack : '') + '</pre>';
        document.body.appendChild(d);
      };
      window.addEventListener('unhandledrejection', function(evt) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:red;color:white;z-index:999999;padding:20px;overflow:auto;word-wrap:break-word;';
        d.innerHTML = '<h2>UNHANDLED PROMISE REJECTION</h2><p>' + (evt.reason ? (evt.reason.message || evt.reason) : 'Unknown') + '</p><pre>' + (evt.reason ? evt.reason.stack : '') + '</pre>';
        document.body.appendChild(d);
      });
      // Catch the PWA install event as early as possible
      window.deferredPWAEvent = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAEvent = e;
      });
      // Force unregister service workers to clear broken cache
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) { registration.unregister(); }
        });
      }
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Assistant:wght@200;300;400;500;600;700;800&family=Caveat:wght@400;700&family=Heebo:wght@100;300;400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/culmus/culmus@master/yehuda/yehuda.css" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js" crossorigin></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
