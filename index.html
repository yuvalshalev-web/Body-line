<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/manifest.json?v=4" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>חבל זוג - עמותת העטלף</title>
    <meta name="description" content="אפליקציית חבל זוג של עמותת העטלף לניהול חברים, סשנים, תחזיות גלים ומפות קהילה" />
    <meta property="og:title" content="חבל זוג - עמותת העטלף" />
    <meta property="og:description" content="אפליקציית חבל זוג של עמותת העטלף לניהול חברים, סשנים, תחזיות גלים ומפות קהילה" />
    <meta name="apple-mobile-web-app-title" content="חבל זוג" />
    
    <script>
      // Catch the PWA install event as early as possible
      window.deferredPWAEvent = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAEvent = e;
      });
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Assistant:wght@200;300;400;500;600;700;800&family=Caveat:wght@400;700&family=Heebo:wght@100;300;400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/culmus/culmus@master/yehuda/yehuda.css" />
  <style>
    body {
      background-color: #0f172a !important; /* Dark Blue so we know it loaded */
      color: white !important;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    .boot-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 9999;
      background-color: #0f172a;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #1e293b;
      border-top: 5px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    #repair-container {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 20px;
      background: rgba(30, 41, 59, 1);
      border-radius: 20px;
      border: 3px solid #ef4444;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      z-index: 10001;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #repair-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 18px 36px;
      border-radius: 14px;
      font-weight: bold;
      font-size: 20px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.5);
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- This is the EMERGENCY repair UI -->
  <div id="repair-container" style="display: none;">
    <p id="repair-instruction" style="margin: 0 0 12px 0; font-size: 14px; text-align: center; color: #f8fafc;">טעינה ראשונית מתעכבת. מרענן גרסה...</p>
    <div style="display: flex; gap: 10px; width: 100%;">
      <button type="button" onclick="window.location.reload(true)" style="flex: 1; background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer;">רענן דף</button>
      <button id="repair-btn" type="button" onclick="repairApp()" style="flex: 1; background: #ef4444; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer;">איפוס מטמון</button>
    </div>
  </div>

  <div id="root">
    <div class="boot-screen">
      <div class="spinner"></div>
      <h2 style="margin: 0 0 10px 0;">טוען את המערכת...</h2>
      <p id="boot-subtext" style="color: #94a3b8; font-size: 14px;">אנא המתן לסיום הטעינה</p>
      <div id="boot-error-display" style="color: #ef4444; font-size: 12px; margin-top: 20px; display: none;"></div>
    </div>
  </div>
  
  <script>
    // Global Error Monitoring & Immediate Recovery
    function triggerAutoRecovery(reason) {
      console.warn("Triggering Auto Recovery:", reason);
      const display = document.getElementById('boot-error-display');
      if (display) {
        display.innerText = reason;
        display.style.display = 'block';
      }
      const repairContainer = document.getElementById('repair-container');
      if (repairContainer) {
        repairContainer.style.display = 'flex';
      }
      // Attempt clean recovery
      setTimeout(() => {
        repairApp();
      }, 1000);
    }

    window.onerror = function(msg, url, line, col, error) {
      const errorMsg = "BOOT ERROR: " + msg + " at " + url + ":" + line;
      console.error(errorMsg);
      triggerAutoRecovery(errorMsg);
      return false;
    };

    window.onunhandledrejection = function(event) {
      const errorMsg = "BOOT PROMISE REJECTION: " + (event.reason ? (event.reason.message || event.reason) : "Unknown reason");
      console.error(errorMsg);
      triggerAutoRecovery(errorMsg);
    };

    window.addEventListener('error', function(event) {
      if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
        const url = event.target.src || event.target.href || 'unknown';
        console.error("BOOT RESOURCE LOAD ERROR: " + url);
        triggerAutoRecovery("שגיאת טעינת משאב: " + url);
      }
    }, true);

    console.log("HTML Start - " + new Date().toISOString());
    const isInIframe = window.self !== window.top;
    const envStatus = document.getElementById('env-status');
    if (envStatus) envStatus.innerText = "סביבה: " + (isInIframe ? "Iframe (Preview)" : "Full Window");
    
    // Complete self-repair logic
    function repairApp() {
      console.warn("repairApp: Purging storage, unregistering SWs, clearing cache storage...");
      try {
        sessionStorage.clear();
        localStorage.removeItem('habal_zug_user');
        
        // 1. Unregister all service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            for (let r of regs) {
              r.unregister();
            }
          }).catch(e => console.warn(e));
        }

        // 2. Delete all caches in CacheStorage
        if ('caches' in window) {
          caches.keys().then(names => {
            for (let name of names) {
              caches.delete(name);
            }
          }).catch(e => console.warn(e));
        }

        // 3. Reload with cache-busting timestamp
        setTimeout(() => {
          const cleanUrl = window.location.origin + window.location.pathname + '?ts=' + Date.now() + window.location.hash;
          window.location.replace(cleanUrl);
        }, 500);
      } catch(e) {
        console.error("Repair failed:", e);
        window.location.reload(true);
      }
    }

    // Auto-check: if app has not booted after 3.5 seconds, auto-heal
    setTimeout(() => {
      const status = document.documentElement.getAttribute('data-app-status');
      if (status !== 'ready') {
        const hasStart = document.documentElement.getAttribute('data-exec-start');
        const hasBeforeRender = document.documentElement.getAttribute('data-exec-before-render');
        
        const repairContainer = document.getElementById('repair-container');
        if (repairContainer) {
          repairContainer.style.display = 'flex';
          repairContainer.style.borderColor = '#3b82f6';
        }
        
        if (!hasStart) {
          console.warn("Bundle script never started executing. Outdated cache likely. Auto-recovering...");
          const subtext = document.getElementById('boot-subtext');
          if (subtext) subtext.innerText = "מטמון ישן זוהה. מרענן אוטומטית...";
          setTimeout(repairApp, 800);
        } else {
          const infoMsg = `App stuck. start=${hasStart}, beforeRender=${hasBeforeRender}, status=${status}`;
          console.error(infoMsg);
          const subtext = document.getElementById('boot-subtext');
          if (subtext) subtext.innerText = infoMsg;
        }
      }
    }, 3500);
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
