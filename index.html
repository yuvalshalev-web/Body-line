    <meta name="description" content="אפליקציית חבל זוג של עמותת העטלף לניהול חברים, סשנים, תחזיות גלים ומפות קהילה" />
    <meta property="og:title" content="חבל זוג - עמותת העטלף" />
    <meta property="og:description" content="אפליקציית חבל זוג של עמותת העטלף לניהול חברים, סשנים, תחזיות גלים ומפות קהילה" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script>
      // Catch the PWA install event as early as possible
      window.deferredPWAEvent = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAEvent = e;
      });
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Assistant:wght@200;300;400;500;600;700;800&family=Caveat:wght@400;700&family=Heebo:wght@100;300;400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/culmus/culmus@master/yehuda/yehuda.css" />
  <style>
    body {
      background-color: #0f172a !important; /* Dark Blue so we know it loaded */
      color: white !important;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    .boot-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 9999;
      background-color: #0f172a;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #1e293b;
      border-top: 5px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    #repair-container {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 20px;
      background: rgba(30, 41, 59, 1);
      border-radius: 20px;
      border: 3px solid #ef4444;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      z-index: 10001;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #repair-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 18px 36px;
      border-radius: 14px;
      font-weight: bold;
      font-size: 20px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.5);
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- This is the EMERGENCY repair UI -->
  <div id="repair-container" style="display: none;">
    <p id="repair-instruction" style="margin: 0 0 12px 0; font-size: 14px; text-align: center; color: #f8fafc;">טעינה ראשונית מתעכבת. מרענן גרסה...</p>
    <div style="display: flex; gap: 10px; width: 100%;">
      <button type="button" onclick="window.location.reload(true)" style="flex: 1; background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer;">רענן דף</button>
      <button id="repair-btn" type="button" onclick="repairApp()" style="flex: 1; background: #ef4444; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer;">איפוס מטמון</button>
    </div>
  </div>

  <div id="root">
    <div class="boot-screen">
      <div class="spinner"></div>
      <h2 style="margin: 0 0 10px 0;">טוען את המערכת...</h2>
      <p id="boot-subtext" style="color: #94a3b8; font-size: 14px;">אנא המתן לסיום הטעינה</p>
      <div id="boot-error-display" style="color: #ef4444; font-size: 12px; margin-top: 20px; display: none;"></div>
    </div>
  </div>
  
  <script>
    // Global Error Monitoring & Graceful Handling
    function isBenignError(str) {
      if (!str) return true;
      const s = String(str).toLowerCase();
      return (
        s.includes('firestore') ||
        s.includes('could not reach cloud firestore') ||
        s.includes('unavailable') ||
        s.includes('internal assertion failed') ||
        s.includes('ca9') ||
        s.includes('b815') ||
        s.includes('resizeobserver') ||
        s.includes('play() failed') ||
        s.includes('abort') ||
        s.includes('offline')
      );
    }

    function showRepairUI(reason) {
      console.warn("Notice during load:", reason);
      const display = document.getElementById('boot-error-display');
      if (display) {
        display.innerText = reason;
        display.style.display = 'block';
      }
      const repairContainer = document.getElementById('repair-container');
      if (repairContainer) {
        repairContainer.style.display = 'flex';
      }
    }

    window.onerror = function(msg, url, line, col, error) {
      const errorMsg = String(msg || error?.message || '');
      if (isBenignError(errorMsg)) {
        console.warn("Ignored non-critical runtime event:", errorMsg);
        return true;
      }
      console.error("Runtime error at " + url + ":" + line, errorMsg);
      return false;
    };

    window.onunhandledrejection = function(event) {
      const reasonStr = String(event?.reason?.message || event?.reason || '');
      if (isBenignError(reasonStr)) {
        console.warn("Ignored non-critical promise rejection:", reasonStr);
        event.preventDefault?.();
        return;
      }
      console.warn("Unhandled promise rejection:", reasonStr);
    };

    console.log("HTML Start - " + new Date().toISOString());
    const isInIframe = window.self !== window.top;
    const envStatus = document.getElementById('env-status');
    if (envStatus) envStatus.innerText = "סביבה: " + (isInIframe ? "Iframe (Preview)" : "Full Window");
    
    // Complete self-repair logic
    function repairApp() {
      console.warn("repairApp: Purging storage and reloading...");
      try {
        sessionStorage.clear();
        localStorage.removeItem('habal_zug_user');
        
        if ('caches' in window) {
          caches.keys().then(names => {
            for (let name of names) caches.delete(name);
          }).catch(e => console.warn(e));
        }

        setTimeout(() => {
          window.location.reload(true);
        }, 300);
      } catch(e) {
        window.location.reload(true);
      }
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
